<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home_page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet/less" type="text/css" href="/CSS_files/style.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="login-container">
            <h2>Secure Login</h2>
            <form id="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <input type="submit" value="Login">
            </form>
            <div class="social-login">
                <button class="google">
                    <img src="/ICON_IMAGE/google_icon.svg" alt="Google">
                    Google
                </button>
                <button class="facebook">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png" alt="Facebook">
                    Facebook
                </button>
            </div>
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            <div class="create-account">
                <button class="btn btn-link" style="text-decoration: none"><a id="show-register">Create an Account</a></button>
            </div>
        </div>

        <div class="register-container" id="register-container">
            <h2>Create Account</h2>
            <form id="register-form">
                <label for="reg-username">Username</label>
                <input type="text" id="register-username" name="username" placeholder="Enter your username" required>

                <label for="email">Email</label>
                <input type="email" id="register-email" name="email" placeholder="Enter your email" required>

                <label for="reg-password">Password</label>
                <input type="password" id="register-password" name="password" placeholder="Enter your password" required>

                <input type="submit" value="Register">
            </form>
            <div class="back-to-login" id="back-to-login">Back to Login</div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/less" ></script>
<script src="functions/fetchFrontenDnBackenD.js"></script>
<script src="functions/frontend_js/script.js"></script>
<div id="notification" class="notification">
    <p id="register-message"></p>
</div>
</body>
</html>
